name: PSP Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build PSP EBOOT.PBP
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/build" \
            -w /build/tentacle_locker_psp_port_v10 \
            ghcr.io/pspdev/pspsdk:latest \
            sh -lc 'make clean all dist'

      - name: Upload PSP build
        uses: actions/upload-artifact@v4
        with:
          name: TENTACLE_LOCKER_PSP
          path: |
            tentacle_locker_psp_port_v10/dist/TENTACLE_LOCKER_PSP/
